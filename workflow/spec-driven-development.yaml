apiVersion: nexus.workflow/v1
kind: DevelopmentWorkflow
constitution: specifications/constitution.md
routerSkill: workflow/skills/nexus-spec-driven-development/SKILL.md
stages:
  - specification_analysis
  - specification_validation
  - impact_analysis
  - implementation_planning
  - implementation
  - independent_verification
  - release_evidence
  - promotion
stageSkills:
  specification_analysis: workflow/skills/nexus-specification-analysis/SKILL.md
  specification_validation: workflow/skills/nexus-specification-validation/SKILL.md
  impact_analysis: workflow/skills/nexus-impact-analysis/SKILL.md
  implementation_planning: workflow/skills/nexus-implementation-planning/SKILL.md
  implementation: workflow/skills/nexus-implementation/SKILL.md
  independent_verification: workflow/skills/nexus-independent-verification/SKILL.md
  release_evidence: workflow/skills/nexus-release-evidence/SKILL.md
  promotion: workflow/skills/nexus-promotion/SKILL.md
rules:
  - Portable specs and contracts are authoritative; adapters do not redefine them.
  - Impact analysis classifies work as capability-only, connector extension, or platform extension.
  - A skill cannot introduce an unsupported platform primitive implicitly.
  - A consequential change requires an independent verifier before promotion.
  - Generated evidence is reproducible from declared inputs and is not source of truth.
