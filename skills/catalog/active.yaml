  internal_transfer:
    version: 2.0.0
    artifact_hash: 79dce9215262a4a9b69f17181c435793e71cdeca907a65f2665958c846edae51
    artifact: internal_transfer/2.0.0/SKILL.md
    routing:
      name: internal_transfer
      version: 2.0.0
      artifact_hash: 79dce9215262a4a9b69f17181c435793e71cdeca907a65f2665958c846edae51
      archetype: deterministic_workflow
      description: Collects, validates, reviews, confirms, and submits one mock internal
        transfer.
      owner: Money Movement
      risk_tier: consequential
      interaction: guided
      execution: workflow
      lifecycle: synchronous
      supported_goals:
      - name: make_internal_transfer
        display_name: make an internal transfer
        keywords:
        - transfer
        - move money
        - send money between
        examples:
        - Transfer $50 from checking to savings.
      input_schema:
        type: object
        required:
        - source_account
        - destination_account
        - amount
        properties:
          source_account:
            type: string
          destination_account:
            type: string
          amount:
            type: string
            pattern: ^[0-9]+(\.[0-9]{1,2})?$
      input_extraction:
        amount:
          strategy: regex
          pattern: (?:\$\s*|\b)(\d+(?:\.\d{1,2})?)\b
          group: 1
        source_account:
          strategy: regex
          pattern: \bfrom\s+([a-z0-9-]+)(?:\s+account)?\s+to\s+([a-z0-9-]+)
          group: 1
        destination_account:
          strategy: regex
          pattern: \bfrom\s+([a-z0-9-]+)(?:\s+account)?\s+to\s+([a-z0-9-]+)
          group: 2
