        goal: live_agent_handoff
      - utterance: I want to speak with a representative.
        goal: live_agent_handoff
      - utterance: Connect me to someone about my auto policy.
        goal: live_agent_handoff
      - utterance: Yes, please transfer me to live support.
        goal: live_agent_handoff
      owner: Contact Center Operations
      risk_tier: handoff
      interaction: guided
      execution: handoff
      lifecycle: synchronous
      supported_goals:
      - name: live_agent_handoff
        display_name: speak with a live agent
        keywords:
        - live agent
        - human
        - person
        - representative
        - talk to someone
      input_schema:
        type: object
        required:
        - reason
        - queue
        properties:
          reason:
            type: string
            description: The member's concise reason for requesting live support;
              preserve the business topic while excluding unnecessary sensitive detail.
          queue:
            type: string
            enum:
