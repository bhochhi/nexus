    artifact: approved_knowledge/2.1.0/SKILL.md
    routing:
      name: approved_knowledge
      version: 2.1.0
      artifact_hash: 99d5c918cfc86e869acf64634a830d7297dc6eeb3d319a30f0c8f15d1f50b1a4
      archetype: knowledge
      display_name: ask an account-policy question
      description: Answers member questions about supported banking and insurance
        policies using only approved local knowledge. Use for informational questions
        about overdraft, deposit insurance, and coverage; do not use for account-specific
        balances, transactions, money movement, or personalized advice.
      sample_utterances:
      - utterance: How does overdraft protection work?
        goal: approved_knowledge
      - utterance: Are my deposits insured?
        goal: approved_knowledge
      - utterance: What coverage applies to this account?
        goal: approved_knowledge
      - utterance: Can you explain the deposit insurance policy?
        goal: approved_knowledge
      owner: Member Knowledge Product
      risk_tier: informational
      interaction: direct
      execution: knowledge_retrieval
      lifecycle: synchronous
      supported_goals:
      - name: approved_knowledge
        display_name: ask an account-policy question
        keywords:
        - overdraft
        - coverage
        - deposit insurance
        - insured
        - insurance
      input_schema:
        type: object
        required:
        - query
        properties:
          query:
            type: string
            minLength: 2
            description: The member's complete informational policy question; preserve
              the subject and qualifiers needed for approved retrieval.
      input_extraction:
        query:
          strategy: full_message
  guided_balance:
    version: 2.2.0
    artifact_hash: 37a82b9195229a7f3eb7bf1471f0e9f06afe3ec1deaee762b55f66130b17fb43
    artifact: guided_balance/2.2.0/SKILL.md
    routing:
      name: guided_balance
      version: 2.2.0
      artifact_hash: 37a82b9195229a7f3eb7bf1471f0e9f06afe3ec1deaee762b55f66130b17fb43
      archetype: guided_resolution
      display_name: check an account balance
      description: Retrieves available balances for eligible checking or savings accounts
        owned by the authenticated member. Use when the member asks how much money
        is available or requests an account balance; do not use to transfer money,
        explain policy, or discuss an unsupported external account.
      sample_utterances:
      - utterance: What is my balance?
        goal: guided_balance
      - utterance: How much do I have in checking?
        goal: guided_balance
      - utterance: Show me the balance for savings 2003.
        goal: guided_balance
      - utterance: How much money is available in account 1002?
        goal: guided_balance
      owner: Deposit Servicing
      risk_tier: read_only
      interaction: guided
      execution: tool_query
      lifecycle: synchronous
      supported_goals:
      - name: guided_balance
        display_name: check an account balance
        keywords:
        - balance
        - how much money
        - how much I have
        - available funds
      input_schema:
        type: object
        properties:
          account_type:
            type: string
            enum:
            - checking
            - savings
            description: The member-stated account type. It narrows eligible accounts
              but does not uniquely identify one when several accounts share that
              type.
          account_number:
            type: string
            description: The account identifier or last four digits the member selected;
              do not infer it merely from account type.
      input_extraction:
        account_type:
          strategy: alias
          aliases:
            checking: checking
            checkings: checking
            savings: savings
            saving: savings
            chk-001: checking
            chk-002: checking
            chk-003: checking
            sav-001: savings
            sav-002: savings
            '1001': checking
            '1002': checking
            '1003': checking
            '2002': savings
            '2003': savings
        account_number:
          strategy: alias
          aliases:
            chk-001: '1001'
            chk-002: '1002'
            chk-003: '1003'
            sav-001: '2002'
            sav-002: '2003'
            '1001': '1001'
            '1002': '1002'
            '1003': '1003'
            '2002': '2002'
            '2003': '2003'
  internal_transfer:
    version: 2.1.0
    artifact_hash: a8328804bdfe48de6bdae2338eb49b1b75ddf62bea4709f31c7a3496b98b8549
    artifact: internal_transfer/2.1.0/SKILL.md
    routing:
      name: internal_transfer
      version: 2.1.0
      artifact_hash: a8328804bdfe48de6bdae2338eb49b1b75ddf62bea4709f31c7a3496b98b8549
      archetype: deterministic_workflow
      display_name: make an internal transfer
      description: Moves money between eligible checking and savings accounts owned
        by the authenticated member. Use for requests to transfer, move, send, or
        put funds from one member-owned account into another; do not use for person-to-person
        payments, bill pay, wires, or transfers involving an external bank.
      sample_utterances:
      - utterance: Transfer $50 from checking to savings.
        goal: internal_transfer
      - utterance: Move two hundred dollars from savings 2003 to checking 1002.
        goal: internal_transfer
      - utterance: Send $200 from my checking account 1001 to savings.
        goal: internal_transfer
      - utterance: Put $75 in my other checking account from savings.
        goal: internal_transfer
      - utterance: I want to move money between my accounts.
        goal: internal_transfer
      owner: Money Movement
      risk_tier: consequential
      interaction: guided
      execution: workflow
      lifecycle: synchronous
      supported_goals:
      - name: internal_transfer
        display_name: make an internal transfer
        keywords:
        - transfer
        - move money
        - send money
        - move funds
        - between my accounts
      input_schema:
        type: object
        required:
        - source_account
        - destination_account
        - amount
        properties:
          source_account:
            type: string
            description: The eligible member account the money leaves. Use the account
              type, identifier, or last four digits stated as the source; if direction
              is unclear, ask instead of guessing.
          destination_account:
            type: string
            description: The eligible member account receiving the money. Use the
              account type, identifier, or last four digits stated as the destination;
              if direction is unclear, ask instead of guessing.
          amount:
            type: string
            format: currency-amount
            description: The monetary amount to transfer. A number used as an account
              identifier or last four digits is not an amount unless the member describes
              it as money.
            pattern: ^[0-9]+(\.[0-9]{1,2})?$
      input_extraction:
        amount:
          strategy: regex
          pattern: \$\s*(\d+(?:\.\d{1,2})?)\b
          group: 1
        source_account:
          strategy: regex
          pattern: \bfrom\s+([a-z0-9-]+)(?:\s+account)?\s+to\s+([a-z0-9-]+)
          group: 1
        destination_account:
          strategy: regex
          pattern: \bfrom\s+([a-z0-9-]+)(?:\s+account)?\s+to\s+([a-z0-9-]+)
          group: 2
