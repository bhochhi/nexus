[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-member-assistant"
version = "0.1.0"
description = "A LangGraph proof of concept for governed financial-services member assistance"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=0.2.60,<0.3",
  "openai>=1.109,<2",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
  "websockets>=12,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
bedrock = [
  "boto3>=1.35,<2",
  "botocore[crt]>=1.35,<2",
]
observability = [
  "opentelemetry-api>=1.33,<1.38",
  "opentelemetry-sdk>=1.33,<1.38",
  "opentelemetry-exporter-otlp-proto-http>=1.33,<1.38",
]
ui = ["streamlit>=1.37,<2"]

[project.scripts]
member-assistant = "member_assistant.cli:main"
member-assistant-admin = "member_assistant.admin_cli:main"
member-assistant-observability = "member_assistant.observability_cli:main"
member-assistant-server = "member_assistant.server_cli:main"
member-assistant-skills = "member_assistant.skill_cli:main"
member-assistant-member-ui = "member_assistant.ui_launcher:member_main"
member-assistant-msr-ui = "member_assistant.ui_launcher:msr_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
