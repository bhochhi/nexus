name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Run Go tests
        run: make test

  conversation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate conversation test schema
        run: |
          python3 -c "
          import yaml, sys
          with open('tests/conversation_tests.yaml') as f:
              data = yaml.safe_load(f)
          assert 'tests' in data, 'Missing tests key'
          print(f'Found {len(data[\"tests\"])} conversation tests')
          "
